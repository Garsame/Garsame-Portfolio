<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  
</head>
<body style="margin:0;background:#EDEFF5;display:flex;justify-content:center;">


  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style> body { margin: 0; } a { color: #3D5AF1; } a:hover { color: #2B45D6; } </style>


<div style="width: 600px; height: 540px; background: #FFFFFF; color: #0E1533; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; box-sizing: border-box; padding: 34px; display: flex; flex-direction: column; gap: 26px; border: 1px solid #E4E8F7;">

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #3D5AF1;">OPTION A</span>
    <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em;">The Cut G</span>
    <span style="font-size: 13px; line-height: 1.6; color: #64708F;">The mark is the site's own signature — the same angled cut that sits on every button.</span>
  </div>

  <div style="display: flex; align-items: center; gap: 28px; padding: 22px 0; border-top: 1px solid #EEF1FB; border-bottom: 1px solid #EEF1FB;">
    <div style="width: 96px; height: 96px; background: #3D5AF1; clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%); display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 54px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.04em; line-height: 1;">G</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #97A2C0;">THE MARK</span>
      <span style="font-size: 14px; line-height: 1.6; color: #64708F; max-width: 300px;">A solid blue tile with the corner taken off. Recognisable at 16 pixels, which is what a favicon actually is.</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #97A2C0;">HORIZONTAL LOCKUP</span>
    <div style="display: flex; align-items: center; gap: 13px;">
      <div style="width: 44px; height: 44px; background: #3D5AF1; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 25px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.04em; line-height: 1;">G</span>
      </div>
      <span style="font-size: 27px; font-weight: 800; letter-spacing: -0.04em;">GARSAME</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; color: #FFFFFF; background: #0E1533; padding: 5px 8px; line-height: 1; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);">v3</span>
    </div>
  </div>

  <div style="display: flex; gap: 16px; margin-top: auto;">
    <div style="flex: 1; background: #F5F7FE; border: 1px solid #E4E8F7; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 13px; align-items: center;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #97A2C0;">SMALL SIZES</span>
      <div style="display: flex; align-items: flex-end; gap: 12px;">
        <div style="width: 32px; height: 32px; background: #3D5AF1; clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%); display: flex; align-items: center; justify-content: center;"><span style="font-size: 18px; font-weight: 800; color: #FFFFFF; line-height: 1;">G</span></div>
        <div style="width: 22px; height: 22px; background: #3D5AF1; clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%); display: flex; align-items: center; justify-content: center;"><span style="font-size: 13px; font-weight: 800; color: #FFFFFF; line-height: 1;">G</span></div>
        <div style="width: 16px; height: 16px; background: #3D5AF1; clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 0 100%); display: flex; align-items: center; justify-content: center;"><span style="font-size: 9px; font-weight: 800; color: #FFFFFF; line-height: 1;">G</span></div>
      </div>
    </div>
    <div style="flex: 1; background: #0E1533; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 13px; align-items: center; justify-content: center;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #7B90FF;">ON DARK</span>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 32px; height: 32px; background: #FFFFFF; clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%); display: flex; align-items: center; justify-content: center;"><span style="font-size: 18px; font-weight: 800; color: #0E1533; line-height: 1;">G</span></div>
        <span style="font-size: 19px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.04em;">GARSAME</span>
      </div>
    </div>
  </div>

</div>

</body>
</html>
