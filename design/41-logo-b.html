<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  
</head>
<body style="margin:0;background:#EDEFF5;display:flex;justify-content:center;">


  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style> body { margin: 0; } a { color: #3D5AF1; } a:hover { color: #2B45D6; } </style>


<div style="width: 600px; height: 540px; background: #FFFFFF; color: #0E1533; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; box-sizing: border-box; padding: 34px; display: flex; flex-direction: column; gap: 26px; border: 1px solid #E4E8F7;">

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #3D5AF1;">OPTION B</span>
    <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em;">The Path</span>
    <span style="font-size: 13px; line-height: 1.6; color: #64708F;">No icon at all. The name is written the way a developer writes a file path, and the slash does the work.</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; padding: 34px 0; border-top: 1px solid #EEF1FB; border-bottom: 1px solid #EEF1FB;">
    <div style="display: flex; align-items: baseline;">
      <span style="font-size: 46px; font-weight: 800; letter-spacing: -0.045em;">garsame</span>
      <span style="font-size: 46px; font-weight: 400; color: #3D5AF1; padding: 0 4px;">/</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 500; color: #3D5AF1; letter-spacing: -0.02em;">v3</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #97A2C0;">WITH THE TAGLINE</span>
    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: baseline;">
        <span style="font-size: 27px; font-weight: 800; letter-spacing: -0.045em;">garsame</span>
        <span style="font-size: 27px; font-weight: 400; color: #3D5AF1; padding: 0 3px;">/</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 500; color: #3D5AF1;">v3</span>
      </div>
      <span style="font-size: 13px; color: #64708F; letter-spacing: 0.01em;">Complex problems, simple software.</span>
    </div>
  </div>

  <div style="display: flex; gap: 16px; margin-top: auto;">
    <div style="flex: 1; background: #F5F7FE; border: 1px solid #E4E8F7; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 13px; align-items: center;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #97A2C0;">FAVICON FALLBACK</span>
      <div style="display: flex; align-items: flex-end; gap: 12px;">
        <div style="width: 32px; height: 32px; background: #3D5AF1; border-radius: 7px; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: #FFFFFF; line-height: 1;">g/</span></div>
        <div style="width: 22px; height: 22px; background: #3D5AF1; border-radius: 5px; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: #FFFFFF; line-height: 1;">g/</span></div>
        <div style="width: 16px; height: 16px; background: #3D5AF1; border-radius: 4px; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 600; color: #FFFFFF; line-height: 1;">g/</span></div>
      </div>
      <span style="font-size: 11px; color: #97A2C0; text-align: center; line-height: 1.5;">a wordmark needs an icon invented for small sizes</span>
    </div>
    <div style="flex: 1; background: #0E1533; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 13px; align-items: center; justify-content: center;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #7B90FF;">ON DARK</span>
      <div style="display: flex; align-items: baseline;">
        <span style="font-size: 24px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.045em;">garsame</span>
        <span style="font-size: 24px; font-weight: 400; color: #7B90FF; padding: 0 3px;">/</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; color: #7B90FF;">v3</span>
      </div>
    </div>
  </div>

</div>

</body>
