# ==============================================================================
# GARSAME v3 — Production Nginx Configuration
# Domain: garsame.so (and www.garsame.so)
# ==============================================================================

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server — Redirects to HTTPS (Port 80 -> 443) & Certbot ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name garsame.so www.garsame.so;

    # Let's Encrypt / Certbot renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP requests to HTTPS permanently
    location / {
        return 301 https://garsame.so$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — TLS Termination & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name garsame.so www.garsame.so;

    # Redirect www to apex domain
    if ($host = www.garsame.so) {
        return 301 https://garsame.so$request_uri;
    }

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/garsame.so/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garsame.so/privkey.pem;

    # TLS Protocols and Ciphers (Mozilla Modern Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum upload size: 11MB (accommodates 10MB media uploads + multipart overhead)
    client_max_body_size 11M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # --------------------------------------------------------------------------
    # Static Assets Caching
    # --------------------------------------------------------------------------

    # Next.js immutable build artifacts
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static files (placeholders, favicon, robots, sitemap)
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml|placeholders/.*)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Dynamic Application Reverse Proxy
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for streaming responses & long-lived editor sessions
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
